<!DOCTYPE html>
<html lang="fr" data-sh-theme="spacehub-dark">
<head>
    <meta charset="UTF-8" />

    <!-- ══ AUDIT A8 / A10 — Politique de sécurité du contenu ═══════════════
         Il n'y en avait AUCUNE, nulle part, alors que docs/XSS_EXCEPTIONS.md
         affirmait le contraire. Or l'application construit énormément de
         balisage par innerHTML à partir de données du serveur : sans CSP, la
         moindre injection réussie disposait de la page entière.

         Limites assumées de la forme <meta>, à connaître avant d'y toucher :
           • `frame-ancestors`, `sandbox` et `report-uri` y sont INOPÉRANTS —
             ils exigent un vrai en-tête HTTP. Le déploiement derrière un
             reverse-proxy doit donc les ajouter (voir docs/DEPLOIEMENT.md).
           • Pas de mode `Report-Only` en <meta>.
           • La règle ne s'applique qu'à partir de son analyse : cette balise
             doit rester la PREMIÈRE du <head> après <meta charset>.

         Choix des directives :
           • `script-src 'self'` — les scripts ne viennent que du bundle. Pas
             de 'unsafe-inline' : c'est ce qui donne sa valeur à la politique.
           • `style-src` accepte 'unsafe-inline' : l'application pose des
             styles en ligne (positions calculées, variables de thème). Le
             style en ligne ne permet pas d'exécuter du code.
           • `img-src` et `media-src` acceptent http: et https: — le serveur
             Jellyfin de l'utilisateur est sur son réseau local, en clair, à
             une adresse qu'on ne connaît pas à l'avance.
           • `frame-src` : uniquement le lecteur YouTube sans cookie.
           • `object-src 'none'` et `base-uri 'none'` : deux vecteurs
             classiques d'évasion de CSP, fermés sans coût pour nous.
         ══════════════════════════════════════════════════════════════════ -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https: http:;
        media-src 'self' blob: https: http:;
        connect-src 'self' blob: https: http: ws: wss:;
        frame-src https://www.youtube-nocookie.com https://www.youtube.com;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'none';
        form-action 'self';
        frame-ancestors 'self';
    " />

    <!-- AUDIT A10 — aucune politique de référent n'était déclarée. Le défaut
         des navigateurs modernes (`strict-origin-when-cross-origin`) envoie
         encore l'origine à chaque requête tierce ; on descend à `no-referrer`
         parce qu'aucune ressource externe n'a besoin de savoir d'où l'on
         vient, et parce que les URL de SpaceHub portent des identifiants
         d'items Jellyfin. -->
    <meta name="referrer" content="no-referrer" />

    <!-- Zoom RÉACTIVÉ (audit WIG : « user-scalable=no / maximum-scale=1 » est
         un anti-pattern listé) : le pincer-zoom est un besoin d'accessibilité
         (WCAG 1.4.4), et iOS en tient compte de toute façon. iOS ≥ 10 ignore
         ces attributs ; Android WebView les honorait encore — le retrait
         réactive le geste partout. viewport-fit=cover expose les
         safe-areas aux encoches (les replis px fixes restent la source de
         vérité : les insets Android WebView sont incohérents). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SpaceHub — Client Web Unifié pour Jellyfin et la suite Servarr" />
    <title>SpaceHub — Media Center</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z'%3E%3C/path%3E%3Cpath d='m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-3.05 11a22.35 22.35 0 0 1-3.95 2z'%3E%3C/path%3E%3C/svg%3E" type="image/svg+xml" />

    <!-- MANIFESTE D'APPLICATION.
         Il manquait, alors qu'un service worker était enregistré au démarrage.
         Conséquence directe et mesurable : sans manifeste, l'application ne
         peut pas être INSTALLÉE — et `navigator.storage.persist()`, que le
         gestionnaire de téléchargements demande au premier transfert, est
         accordé bien plus volontiers à un site installé. Les téléchargements
         hors ligne étaient donc « au mieux » à cause d'un fichier absent. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpaceHub" />
    <link rel="apple-touch-icon" href="/icone.svg" />

    <!-- POLICE INTER — un seul fichier, axe variable.
         La demande était `wght@300;400;500;600;700;800`, c'est-à-dire SIX
         fichiers statiques. Or les feuilles de style déclarent `font-weight:
         750` cent quatre fois, et 750 ne figurait pas dans cette liste : le
         navigateur retombait sur 700 ou synthétisait la graisse. Cent quatre
         déclarations qui ne produisaient pas ce qu'elles disaient.
         `wght@300..800` demande l'AXE : un seul fichier, toutes les graisses
         intermédiaires, et 750 rend enfin juste. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet" />

    <!-- Design Tokens — servis tels quels depuis public/ (jamais empaquetés).
         C'est volontaire : ce lien doit précéder la feuille générée par Vite,
         sans quoi les tokens écraseraient les règles des composants. -->
    <link rel="stylesheet" href="/design-system/tokens.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--sh-bg-base, #000000);
            color: var(--sh-text-primary, #f0f0f8);
            font-family: var(--sh-font-family, 'Inter', sans-serif);
            overflow-x: hidden;
            overflow-y: auto !important;
            -webkit-font-smoothing: antialiased;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        #app {
            display: block;
            width: 100%;
            /* 100dvh : la hauteur RÉELLE du viewport — 100vh inclut la zone
               que la barre système Android occupe/réserve ; sur GSM le splash
               et la coquille débordaient sinon sous la barre de navigation
               gestuelle. Repli vh pour les vieux moteurs. */
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #000000;
            overflow: visible;
            position: relative;
        }



        /* App Loading Splash Screen */
        #sh-splash-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--sh-bg-base, #101014);
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .sh-splash-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--sh-color-primary, #7c6aff));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        @keyframes sh-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .sh-splash-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: var(--sh-color-primary, #7c6aff);
            border-radius: 50%;
            animation: sh-spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div id="sh-splash-loader">
        <h1 class="sh-splash-title">SpaceHub</h1>
        <div class="sh-splash-spinner"></div>
    </div>

    <div id="app"></div>

    <script type="module" src="/core/SpaceHub.js"></script>
</body>
</html>
