<!DOCTYPE html>
<html lang="fr" data-sh-theme="spacehub-dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101014" />
    <meta name="description" content="SpaceHub — Client Web Unifié pour Jellyfin et la suite Servarr" />
    <title>SpaceHub — Media Center</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z'%3E%3C/path%3E%3Cpath d='m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-3.05 11a22.35 22.35 0 0 1-3.95 2z'%3E%3C/path%3E%3C/svg%3E" type="image/svg+xml" />

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Design Tokens -->
    <link rel="stylesheet" href="/ui/design-system/tokens.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--sh-bg-base, #000000);
            color: var(--sh-text-primary, #f0f0f8);
            font-family: var(--sh-font-family, 'Inter', sans-serif);
            overflow-x: hidden;
            overflow-y: auto !important;
            -webkit-font-smoothing: antialiased;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        #app {
            display: block;
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            overflow: visible;
            position: relative;
        }



        /* App Loading Splash Screen */
        #sh-splash-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--sh-bg-base, #101014);
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .sh-splash-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--sh-color-primary, #7c6aff));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        @keyframes sh-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .sh-splash-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.08);
            border-top-color: var(--sh-color-primary, #7c6aff);
            border-radius: 50%;
            animation: sh-spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div id="sh-splash-loader">
        <h1 class="sh-splash-title">SpaceHub</h1>
        <div class="sh-splash-spinner"></div>
    </div>

    <div id="app"></div>

    <script type="module" src="/core/SpaceHub.js"></script>
</body>
</html>
