# SpaceHub — veille du keystore d'amorçage
#
# POURQUOI CE WORKFLOW EXISTE
# ---------------------------
# Tant qu'ANDROID_KEYSTORE n'est pas promu en secret (docs/PROMOTION_KEYSTORE.md),
# la seule copie de la clé de signature APK est l'artefact éphémère téléversé
# par le workflow Paquets, retenu 30 jours. Passé ce délai, la promotion est
# impossible et la prochaine version signe avec une clé neuve : les mises à
# jour en place échouent. Un rappel humain dépend de la mémoire ; un job
# quotidien ne dort jamais. Le script sort 0 tant qu'il reste plus de
# 7 jours, 1 sinon — l'échec du run rend l'alerte visible dans GitHub.
#
# POURQUOI UN JOB SÉPARÉ ET PAS UNE ÉTAPE DE paquets.yml
# ------------------------------------------------------
# Le compte à rebours de rétention est calendaire : il doit tourner même
# quand aucun paquet n'est fabriqué. Un cron indépendant est la seule
# horloge fiable. Le coût est un appel `gh api` par jour.
#
# Note : GITHUB_TOKEN d'un workflow `schedule` suffit ici — la lecture des
# artefacts d'un dépôt est dans ses permissions par défaut (read). Le script
# accepte aussi GH_TOKEN pour un usage hors CI (machine de maintenance).

name: Veille keystore

on:
  schedule:
    # 07:00 UTC chaque jour — un retard de quelques heures ne change rien
    # à un compte à rebours de 30 jours.
    - cron: '0 7 * * *'
  workflow_dispatch: # relance manuelle après une promotion

jobs:
  veille-keystore:
    name: Alerte rétention keystore d'amorçage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier la fenêtre de promotion (30 jours, alerte à 7 jours)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verifier-amorcage-keystore.mjs