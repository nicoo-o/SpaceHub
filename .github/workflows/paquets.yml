# SpaceHub — paquets natifs (APK Android, exécutable Windows)
#
# POURQUOI CE WORKFLOW EXISTE
# ---------------------------
# La release v1.0.1 ne publiait que l'archive web (dist/) : pour la poser
# sur une TV il fallait déjà savoir servir un site statique. Les APK et
# .exe sont la réponse au « je veux installer, pas déployer ». Ce workflow
# construit, pour chaque tag v*, un APK Android (Cordova — le même build
# web embarqué dans une WebView autonome) et un exécutable Windows
# (Electron — installeur NSIS + portable).
# Les deux jobs tournent
# UNIQUEMENT après que le workflow Release a conclu avec succès sur le
# même commit de tag — Release fait tourner la chaîne complète (tests,
# contrats, build, e2e) AVANT de publier l'archive web. Aucun paquet
# natif ne peut donc contenir du code que la vérification n'a pas vu.
# (Verify, filtré sur les branches, ne tourne jamais sur un push de tag :
# c'est bien Release qui est la porte du tag.)
#
# SUR QUOI IL S'APPUIE
# --------------------
#   scripts/preparer-bobines.mjs  reconstruit build/cordova et
#                                 build/electron depuis dist/ + icône SVG
#   scripts/icone-vers-png.mjs    rasterisation SVG→PNG/ICO sans dépendance
#
# SECRET DE SIGNATURE (APK) — comment il est fabriqué
# ---------------------------------------------------
#   1. Laisser ce workflow tourner une fois : sans secret, l'APK est signé
#      par une clé éphémère générée à la volée (valable pour tester,
#      pas pour enchaîner des mises à jour).
#   2. Récupérer la clé publique affichée dans le résumé du run, puis
#      GitHub Actions → Secrets → « Actions secrets » :
#        ANDROID_KEYSTORE = le fichier .keystore encodé en base64
#        ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   3. Re-lancer le job : l'APK est signé par cette clé permanente, et les
#      versions suivantes s'installent par-dessus les précédentes.
# Le keystore ne vit JAMAIS dans le dépôt (public) — cette routine
# d'amorçage est le seul moyen d'en créer un sans jamais le versionner.

name: Paquets

on:
  workflow_dispatch:
    # Lancement à la main : construit les paquets de la branche courante
    # et les publie comme artefacts de run (jamais attachés à une release).
    # Cas d'usage principal : reconstruire les paquets d'un tag existant
    # (paquets.yml corrigé APRÈS le tag) — passer `version: vX.Y.Z` : le
    # checkout part du commit du tag, et l'attachement à la release s'active.
    inputs:
      version:
        description: 'Tag existant à reconstruire (ex. v1.1.0). Vide : branche courante.'
        required: false
        default: ''
  workflow_run:
    # Déclenché quand Release conclut sur un push de tag v* : les paquets
    # sont construits depuis CE commit de tag, après sa chaîne verte.
    workflows: ['Release']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: paquets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier-conclusion:
    # workflow_run tourne après TOUTE conclusion de Release ; sur un tag,
    # on ne construit des paquets que si Release a réussi.
    runs-on: ubuntu-latest
    outputs:
      construire: ${{ steps.verdict.outputs.construire }}
      # SHA à construire : commit du tag pour un rebuild manuel, sinon le
      # SHA validé par Release (workflow_run) ou le HEAD courant.
      sha: ${{ steps.verdict.outputs.sha }}
      version: ${{ steps.verdict.outputs.version }}
    steps:
      - id: verdict
        env:
          VERSION_SAISIE: ${{ inputs.version }}
          # gh api (vérification d'existence du tag) exige le jeton explicite.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$VERSION_SAISIE" ]; then
            # Rebuild manuel d'un tag : checkout du commit du tag, attachement
            # à la release activé. AUCUNE vérification de chaîne n'est contournée
            # : les paquets partent du commit exact que Release a validé.
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION_SAISIE" > /dev/null 2>&1; then
              echo "Tag $VERSION_SAISIE introuvable sur origin" >&2; exit 1
            fi
            echo "construire=oui" >> "$GITHUB_OUTPUT"
            echo "sha=$VERSION_SAISIE" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION_SAISIE" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "construire=oui" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ] && [[ "${{ github.event.workflow_run.head_branch }}" == v* ]]; then
            echo "construire=oui" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "construire=non" >> "$GITHUB_OUTPUT"
            echo "Release n'a pas réussi sur un tag v* — aucun paquet natif ne sera construit."
          fi

  apk:
    name: APK Android (Cordova)
    needs: verifier-conclusion
    if: needs.verifier-conclusion.outputs.construire == 'oui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Commit exact validé (tag rebuilt, workflow_run) ou HEAD courant.
          ref: ${{ needs.verifier-conclusion.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK : le runner ubuntu-latest embarque déjà le SDK complet
      # (sdkmanager, platforms, build-tools) — il ne manque que la licence
      # d'acceptation, pré-acceptée sur l'image, et ANDROID_HOME est préposé.
      - name: Installer les dépendances web
        run: npm ci

      # Le SDK Android téléchargé par Cordova exige une arborescence
      # exacte ; Cordova sait l'installer lui-même, mais `npm ci` d'un
      # projet non-déclaré est exclu — on installe l'outillage Cordova
      # dans un dossier outillage/ à côté de la bobine.
      - name: Installer l'outillage Cordova
        run: |
          mkdir -p build/outillage
          cd build/outillage
          npm init -y > /dev/null
          npm install cordova@13 --no-audit --no-fund 2>&1 | tail -1

      - name: Construire le web (dist/)
        run: npm run build

      - name: Préparer la bobine Cordova
        env:
          VERSION_BRUTE: ${{ needs.verifier-conclusion.outputs.version }}
        # v1.2.3 → 1.2.3 : versionName Android et noms de fichiers sans « v ».
        run: SPACEHUB_PAQUET_VERSION="${VERSION_BRUTE#v}" node scripts/preparer-bobines.mjs

      - name: Ajouter la plateforme Android
        working-directory: build/cordova
        run: ../outillage/node_modules/.bin/cordova platform add android@15 --no-telemetry 2>&1 | tail -3

      - name: Signature de l'APK
        # id : permet à l'étape d'artefact de savoir si ce run est un run
        # d'amorçage (clé éphémère) ou un run signé par le secret.
        id: signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd build/cordova
          # « release » est une OPTION (--release), pas un argument de
          # plateforme — passé nu, Cordova le lit comme un nom de plateforme
          # inexistant et ne construit aucun APK. Les drapeaux de signature
          # vont APRÈS le séparateur -- (relais vers gradle). Les deux points
          # ci-dessous ont rendu le premier run v1.1.0 silencieusement stérile.
          COMMANDE=(../outillage/node_modules/.bin/cordova build android --release
            -- --packageType=apk --no-telemetry
            --keystore=spacehub.keystore --alias=${KEY_ALIAS:-spacehub})
          MOT_DE_PASSE=$KEYSTORE_PASSWORD
          if [ -z "$KEYSTORE_B64" ]; then
            # Pas de secret : amorçage — clé éphémère, documentée dans le
            # résumé du run pour devenir permanente à l'étape suivante.
            echo "amorcage=oui" >> "$GITHUB_OUTPUT"
            keytool -genkeypair -v -keystore spacehub.keystore \
              -alias spacehub -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass spacehub-ephemere -keypass spacehub-ephemere \
              -dname "CN=SpaceHub, OU=Ephemeral, O=SpaceHub, C=FR"
            MOT_DE_PASSE=spacehub-ephemere
          fi
          set +e
          "${COMMANDE[@]}" --storePassword="$MOT_DE_PASSE" --password="$MOT_DE_PASSE" > ../cordova-build.log 2>&1
          CODE=$?
          set -e
          tail -12 ../cordova-build.log
          if [ $CODE -ne 0 ]; then
            echo "::error::La construction Cordova a échoué (code $CODE) — journal complet : cordova-build.log ci-dessous."
            tail -60 ../cordova-build.log >&2 || true
            exit $CODE
          fi
          if [ -z "$KEYSTORE_B64" ]; then
            EMPREINTE=$(keytool -list -v -keystore spacehub.keystore -storepass spacehub-ephemere -alias spacehub | grep 'SHA256:' | head -1)
            echo "### Clé de signature éphémère (à promouvoir en secret)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "EMPREINTE SHA256 : $EMPREINTE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Le keystore est détruit ci-dessous (jamais dans le dépôt) — mais
            # il est D'ABORD téléversé comme artefact de run chiffré, afin que
            # le propriétaire puisse le télécharger et le charger en secret
            # ANDROID_KEYSTORE. Sans cet artefact, l'empreinte affichée
            # désignerait une clé déjà perdue : impossible de construire
            # dessus. Le run n'est conservé que 30 jours : la promotion en
            # secret doit suivre la première version signée.
            # CHEMIN EXACT attendu par l'étape d'upload ci-dessous (racine du
            # workspace). Depuis build/cordova, `../../` remonte de DEUX crans :
            # `../` seul donnait build/keystore-amorcage — l'upload ne trouvait
            # rien, se contentait de « ignore », et la clé était détruite avec
            # le runner. C'est ainsi que la clé v1.2.0 a été perdue.
            mkdir -p ../../keystore-amorcage
            cp spacehub.keystore ../../keystore-amorcage/spacehub-ephemere.keystore
          fi
          rm -f spacehub.keystore

      - name: Artefact du journal de build Cordova
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cordova-build-log
          path: build/cordova-build.log
          retention-days: 7

      - name: Artefact du keystore d'amorçage
        # Armé UNIQUEMENT quand la clé éphémère vient d'être créée.
        # `if-no-files-found: error` (et non « ignore ») : en amorçage, une
        # clé manquante est un ÉCHEC BRUYANT. Un « ignore » ici avait laissé
        # passer deux runs verts sans keystore — l'empreinte affichée désignait
        # alors une clé déjà perdue. Plus jamais silencieux.
        if: success() && steps.signature.outputs.amorcage == 'oui'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: keystore-amorcage-a-promouvoir-en-secret
          path: keystore-amorcage/spacehub-ephemere.keystore
          retention-days: 30

      - name: Rassembler les APK
        env:
          VERSION: ${{ needs.verifier-conclusion.outputs.version }}
        run: |
          mkdir -p apk
          shopt -s nullglob
          find build/cordova/platforms/android -name '*.apk' -path '*release*' -exec cp {} apk/ \;
          # Garde-fou bruyant : après l'incident v1.1.0 (build silencieusement
          # stérile), une collecte vide est un échec IMMÉDIAT et explicite —
          # plus jamais un « not a ZIP » d'apksigner comme seul indice.
          if [ -z "$(ls -A apk 2>/dev/null)" ]; then
            echo "::error::Aucun APK trouvé sous build/cordova/platforms/android — la construction a échoué sans le dire. Journal : artefact cordova-build-log."
            exit 1
          fi
          # Nom explicite : spacehub-v1.2.3.apk (Cordova garde le sien en interne).
          for f in apk/*-release.apk; do mv "$f" "apk/spacehub-${VERSION}.apk"; done
          ls -la apk/
          # Garde-fou : un APK « release » non signé est un échec, pas un
          # livrable — apksigner (build-tools du runner) le détecte.
          APK=$(ls apk/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > /dev/null
          for f in apk/*.apk; do sha256sum "$f" > "$f.sha256"; done

      - name: Artefact du run
        uses: actions/upload-artifact@v7
        with:
          name: spacehub-android
          path: |
            apk/*.apk
            apk/*.apk.sha256
          retention-days: 30

      - name: Attacher à la release
        if: startsWith(needs.verifier-conclusion.outputs.version, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verifier-conclusion.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$VERSION" apk/*.apk apk/*.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            echo "APK attachés à la release $VERSION"
          else
            echo "Release $VERSION absente — APK laissés en artefact de run uniquement."
          fi

  exe:
    name: Exécutable Windows (Electron)
    needs: verifier-conclusion
    if: needs.verifier-conclusion.outputs.construire == 'oui'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Commit exact validé (tag rebuilt, workflow_run) ou HEAD courant.
          ref: ${{ needs.verifier-conclusion.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances web
        run: npm ci

      - name: Construire le web (dist/)
        run: npm run build

      - name: Préparer la bobine Electron
        # shell: bash obligatoire : sans lui, le runner Windows exécute la
        # recette sous pwsh — qui ne connaît pas la syntaxe d'env-prefix bash
        # (VAR=valeur commande) et échoue comme sur le premier run v1.1.0.
        shell: bash
        env:
          VERSION_BRUTE: ${{ needs.verifier-conclusion.outputs.version }}
        run: SPACEHUB_PAQUET_VERSION="${VERSION_BRUTE#v}" node scripts/preparer-bobines.mjs

      - name: Construire l'exécutable Windows
        working-directory: build/electron
        # electron-builder télécharge l'Electron déclaré dans la bobine
        # (mis en cache par lui dans %LOCALAPPDATA%) et produit NSIS +
        # portable dans sortie/.
        #
        # SIGNATURE AZURE (décision docs/SIGNATURE_WINDOWS_ET_AUTO_UPDATE.md) :
        # les variables AZURE_* du profil sont passées à la bobine (qui ne
        # pose le bloc win.sign QUE si les trois variables du profil sont
        # présentes) et à AzureSignTool (auth Entra ID par les trois
        # variables d'identité). Secrets absents → build non signé, la CI
        # continue ; la porte de vérification ci-dessous tranche.
        shell: bash
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          # electron-updater (dépendance d'exécution du paquet) : installé
          # dans la bobine AVANT le build — electron-builder empaquette
          # node_modules/ (dépendances de production uniquement).
          npm install --omit=dev --no-audit --no-fund 2>&1 | tail -1
          npx --yes electron-builder@26 --win --x64 --publish never 2>&1 | tail -6
          ls -la sortie/

      - name: Rassembler les exécutables
        shell: bash
        run: |
          mkdir -p exe
          # Les DEUX seuls livrables : l'installeur NSIS et le portable.
          # Un balayage « -name '*.exe' » récupérait aussi les internes
          # d'electron-builder — SpaceHub.exe (le stub décompressé, 246 Mo,
          # inutilisable sans son resources/) et elevate.exe (son utilitaire
          # d'élévation) — joints à la release v1.1.0 par erreur et retirés
          # à la main.
          find build/electron/sortie -maxdepth 1 \( -name '*-Setup-*.exe' -o -name '*-portable.exe' \) -exec cp {} exe/ \;
          # Garde-fou : exactement deux livrables, rien de plus.
          if [ "$(ls exe | wc -l)" -ne 2 ]; then
            echo "::error::Attendu : installeur + portable. Trouvé :" >&2
            ls -la exe/ >&2
            exit 1
          fi
          ls -la exe/
          for f in exe/*.exe; do sha256sum "$f" > "$f.sha256"; done

          # Métadonnées d'auto-update (electron-updater) : latest.yml et les
          # blockmaps accompagnent les exécutables à la release. Sans elles,
          # le canal de mise à jour est muet. Générées par electron-builder
          # dès que la config publish existe (--publish never n'empêche pas
          # leur production, seulement leur envoi).
          cp build/electron/sortie/latest.yml exe/ 2>/dev/null || true
          cp build/electron/sortie/*.blockmap exe/ 2>/dev/null || true
          ls -la exe/

      - name: Porte de signature — Get-AuthenticodeSignature
        # Ne s'arme QUE quand les secrets de signature sont présents : sans
        # eux, le build non signé est un état attendu et documenté (la porte
        # doit rester silencieuse). Avec eux, un livrable NotSigned est un
        # ÉCHEC : la chaîne de signature a échoué sans le dire.
        # ATTENTION : le contexte `secrets` est INTERDIT dans un `if:` — le
        # fichier devient invalide et TOUT le workflow tombe en run à zéro
        # job (défaut trouvé au moment de sortir la v1.3.0). Les secrets
        # passent donc par `env`, seul contexte lisible dans un `if:`.
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_SECRET != '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          $problemes = @()
          Get-ChildItem exe/*.exe | ForEach-Object {
              $statut = (Get-AuthenticodeSignature $_.FullName).Status
              Write-Host "$($_.Name) : $statut"
              if ($statut -eq 'NotSigned') { $problemes += $_.Name }
          }
          if ($problemes.Count -gt 0) {
              Write-Error "Livrables NON signés alors que les secrets Azure sont présents : $($problemes -join ', ')"
              exit 1
          }
          Write-Host "Tous les exécutables sont signés (Authenticode)."

      - name: Rappel — build non signé (secrets absents)
        # Le pendant, pour que l'état « non signé » reste visible dans le
        # résumé du run au lieu d'être silencieux.
        # Même règle que la porte ci-dessus : `secrets` interdit dans `if:`.
        if: ${{ env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_CLIENT_SECRET == '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        run: |
          echo "::warning::Aucun secret de signature Azure — exécutables livrés NON signés (SmartScreen affichera l'avertissement). Voir docs/SIGNATURE_WINDOWS_ET_AUTO_UPDATE.md."

      - name: Artefact du run
        uses: actions/upload-artifact@v7
        with:
          name: spacehub-windows
          path: |
            exe/*.exe
            exe/*.exe.sha256
          retention-days: 30

      - name: Attacher à la release
        if: startsWith(needs.verifier-conclusion.outputs.version, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verifier-conclusion.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Tout le dossier exe/ : les deux exécutables, leurs sommes, et
            # les métadonnées d'auto-update (latest.yml + blockmaps).
            gh release upload "$VERSION" exe/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "Exécutables et métadonnées d'auto-update attachés à la release $VERSION"
          else
            echo "Release $VERSION absente — exécutables laissés en artefact de run uniquement."
          fi
