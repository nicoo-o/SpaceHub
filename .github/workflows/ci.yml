# SpaceHub — intégration continue
#
# POURQUOI CE FICHIER EXISTE
# --------------------------
# `npm run verify` est une excellente porte de fusion qui ne s'exécutait que
# lorsque quelqu'un y pensait. Chaque contrat automatisé du dépôt (navigation,
# XSS, poids, taille, contraste…) était, à un checkout périmé près, violable
# en silence. Ce workflow fait tourner la totalité de la chaîne à chaque push
# et chaque pull request — la branche principale ne peut plus régresser sans
# que ce soit visible.
#
# Il produit aussi un artefact : le build de `main`, téléchargeable depuis
# l'onglet Actions pendant 30 jours. C'est le moyen le plus direct de poser
# l'application sur un téléviseur sans rien installer localement.
#
# DEUX GÉNÉRATIONS DE CHROMIUM POUR L'E2E
# ---------------------------------------
# La suite e2e mesure le navigateur autant que l'application. Le 9 septembre
# 2026, Chromium 151 a fait échouer deux scénarios verts sur main : un contour
# SUPPRIMÉ se lisait avec une largeur et une couleur résiduelles (3px, blanc)
# au lieu de 0px, et le navigateur peignait son propre anneau sur
# :focus-visible. Rien n'avait changé dans l'application. Pour que ce type de
# dérive soit VU avant de mordre, l'e2e tourne sur deux jambes :
#   1. `e2e-epingle`  — Chromium épinglé (playwright@1.62.1, révision 1234),
#      la base validée du dépôt ; un échec ici est une régression de l'app.
#   2. `e2e-courant`  — dernière version publiée de Playwright et son
#      Chromium ; un échec ici est une dérive du NAVIGATEUR à investiguer.
# Concrètement : quand la jambe courante devient rouge, on met à jour les
# mesures devenues obsolètes, puis on remonte la version épinglée avec la
# preuve à l'appui. La base validée ne saute jamais de version à l'aveugle.

name: Verify

on:
  push:
    # Toutes les branches, SAUF celles de Dependabot : ses pull requests
    # déclenchent déjà la CI via `pull_request` — sans cette exclusion, chaque
    # mise à jour de dépendance tournerait deux fois.
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches: [main]

# Un nouveau push sur la même branche annule l'exécution précédente — sauf
# sur main, dont chaque build publié mérite d'aller jusqu'au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 : l'outillage de contrôle utilise `module.registerHooks`,
          # disponible à partir de Node 22.15 (cf. scripts/css-stub-loader.mjs).
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # La chaîne complète : lint, tests unitaires, smoke, contrats statiques
      # (navigation, entrées, focus, gabarits, CSS, XSS, globaux, contraste,
      # taille des monolithes, conformité du changelog).
      - name: Chaîne de vérification
        run: npm run test

      - name: Construction
        run: npm run build

      - name: Contrat de poids
        run: npm run test:poids

      # `playwright-core` ne sait pas télécharger de navigateur : on installe
      # Chromium avec le paquet complet `playwright` à la version épinglée
      # (le dépôt utilise playwright-core ^1.62.1). L'appel `npx` évite
      # d'ajouter une dépendance au projet ; pour un cache plus rapide sur
      # beaucoup d'exécutions, remplacer par une dépendance de développement
      # `playwright@1.62.1` et le cache intégré de `setup-node`.
      # --with-deps passe par apt : le dépôt google-chrome préconfiguré sur
      # l'image des runners sert parfois des métadonnées incohérentes entre
      # nœuds du CDN (« Hash Sum mismatch » sur dl.google.com) et fait
      # échouer le moindre `apt-get update` — alors que playwright n'y puise
      # RIEN (ses bibliothèques viennent des archives Ubuntu). On retire ce
      # dépôt avant l'installation, et on réessaie par prudence : tout
      # miroir peut dériver quelques minutes.
      - name: Installer Chromium épinglé
        run: |
          for i in 1 2 3 4 5; do
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list* /etc/apt/sources.list.d/google-chrome.sources
            if npx -y playwright@1.62.1 install --with-deps chromium; then exit 0; fi
            echo "Tentative $i échouée — nettoyage apt, nouvelle tentative dans 30 s" >&2
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get update
            sleep 30
          done
          exit 1

      # Les scripts e2e cherchent SPACEHUB_CHROMIUM, puis leurs chemins
      # internes, puis Chrome/Edge locaux. On résout ici le chemin réel de
      # l'installation précédente pour ne rien laisser au hasard.
      - name: Localiser Chromium épinglé
        run: |
          CHEMIN=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)
          if [ -z "$CHEMIN" ]; then echo "Chromium épinglé introuvable après installation" >&2; exit 1; fi
          echo "SPACEHUB_CHROMIUM=$CHEMIN" >> "$GITHUB_ENV"
          echo "Chromium épinglé : $CHEMIN"

      # 30 scénarios dans le Chromium épinglé — la base validée. Un échec
      # est une régression de l'application, à corriger, jamais à abstendre.
      - name: E2E sur Chromium épinglé
        run: npm run test:e2e

      # Le build de main, posé ici : c'est la version à télécharger pour
      # tester sur téléviseur, téléphone ou PC avant la prochaine release.
      - name: Publier le build de main comme artefact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: spacehub-main
          path: dist/
          retention-days: 30

  # Fumée packaging Android : la release construit déjà l'APK complet, mais
  # attendre un tag pour découvrir une erreur config.xml est trop tard. Cette
  # jambe prépare exactement la bobine et ajoute la plateforme Cordova sur
  # chaque push/PR ; elle attrape les ressources, manifestes et versions
  # invalides avant qu'un paquet ne soit publiable.
  packaging-smoke:
    name: Smoke packaging Android (Cordova)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances web
        run: npm ci

      - name: Installer Cordova
        run: |
          mkdir -p build/outillage
          cd build/outillage
          npm init -y > /dev/null
          npm install cordova@13 --no-audit --no-fund 2>&1 | tail -1

      - name: Construire le web
        run: npm run build

      - name: Préparer la bobine Cordova
        run: node scripts/preparer-bobines.mjs

      - name: Ajouter la plateforme Android
        working-directory: build/cordova
        run: ../outillage/node_modules/.bin/cordova platform add android@15 --no-telemetry

      - name: Vérifier la fusion TV
        working-directory: build/cordova
        shell: bash
        run: |
          test -f platforms/android/app/src/main/res/drawable-xhdpi/banner.png
          test -f platforms/android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' platforms/android/app/src/main/AndroidManifest.xml
          grep -q 'android:banner="@drawable/banner"' platforms/android/app/src/main/AndroidManifest.xml
          echo "Bobine Cordova valide : bannière et entrée LEANBACK fusionnées."

      # Garde du pont Android : une balise cordova.js absente de www/ rend
      # window.cordova undefined — PontAndroid reste silencieux, l'app tourne,
      # mais le bouton retour système TUE l'application au lieu de fermer la
      # couche ouverte. Défaut silencieux de la même famille que l'artefact
      # keystore jamais téléversé (v1.2.0) : la CI doit le voir, pas
      # l'utilisateur.
      # Le FICHIER cordova.js lui-même est écrit par `cordova platform add`
      # (étape précédente) dans platform_www et copié vers www/ à la
      # préparation — on ne vérifie donc que la BALISE : sa présence dans
      # index.html embarqué est ce que preparer-bobines.mjs maîtrise, et
      # sans elle window.cordova serait undefined même avec le fichier.
      - name: Vérifier le pont Android
        working-directory: build/cordova
        shell: bash
        run: |
          test -f platforms/android/platform_www/cordova.js || { echo "::error::cordova.js absent de platform_www — 'cordova platform add' n'a pas livré le pont natif."; exit 1; }
          grep -q 'src="cordova.js"' www/index.html || { echo "::error::la balise <script src=cordova.js> n'a pas été injectée dans www/index.html."; exit 1; }
          grep -q 'AndroidWindowSoftInputMode' config.xml || { echo "::error::AndroidWindowSoftInputMode=adjustResize absent de config.xml — le clavier masque les champs."; exit 1; }
          echo "Pont Android valide : balise injectée, pont natif livré, clavier adjustResize."

      - name: Conserver le journal Cordova en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cordova-packaging-smoke-log
          path: |
            build/cordova/*.log
            build/cordova/platforms/android/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # La jambe « courant » : même suite, navigateur le plus récent. Rouge ici
  # ne bloque pas la publication de l'artefact — elle signale que le
  # navigateur a bougé sous nos pieds et qu'il faut relire les mesures.
  e2e-courant:
    name: E2E sur Chromium courant (dérive navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construction
        run: npm run build

      # Même traitement que l'installation épinglée : le dépôt google-chrome
      # de l'image n'apporte rien à playwright et fait échouer apt quand son
      # CDN dérive.
      - name: Installer le Playwright le plus récent
        run: |
          for i in 1 2 3 4 5; do
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list* /etc/apt/sources.list.d/google-chrome.sources
            if npx -y playwright@latest install --with-deps chromium; then exit 0; fi
            echo "Tentative $i échouée — nettoyage apt, nouvelle tentative dans 30 s" >&2
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get update
            sleep 30
          done
          exit 1

      - name: Localiser Chromium courant
        run: |
          CHEMIN=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)
          if [ -z "$CHEMIN" ]; then echo "Chromium courant introuvable après installation" >&2; exit 1; fi
          echo "SPACEHUB_CHROMIUM=$CHEMIN" >> "$GITHUB_ENV"
          echo "Chromium courant : $CHEMIN"

      - name: E2E sur Chromium courant
        run: npm run test:e2e
