# SpaceHub — publication d'une release
#
# COMMENT ON PUBLIE
# -----------------
#   1. S'assurer que la CI est verte sur main.
#   2. Mettre à jour « version » dans package.json si le tag est significatif.
#   3.   git tag v1.0.1 && git push origin v1.0.1
#
# Le push du tag déclenche ce workflow, qui fait tourner LA MÊME chaîne que la
# CI — tests, contrats, build, e2e — avant de mettre dist/ en pièce jointe.
# Une release ne peut donc jamais contenir du code que la suite n'a pas vu.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier:
    name: Vérifier, construire, publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 : l'outillage de contrôle utilise `module.registerHooks`,
          # disponible à partir de Node 22.15 (cf. scripts/css-stub-loader.mjs).
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Chaîne de vérification
        run: npm run test

      # Les notes viennent du changelog, pas des messages de commit : le
      # script échoue si la section du tag manque — on ne publie donc jamais
      # une release sans notes écrites pour celui qui télécharge.
      - name: Extraire les notes de release
        run: |
          node scripts/notes-release.mjs "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          # Pied de page commun. Attention aux accents graves : entre guillemets
          # doubles, bash y voit une substitution de commande — d'où les
          # apostrophes qui encadrent les segments contenant des backticks.
          {
            echo ""
            echo "---"
            echo '**Download:** `'"spacehub-${GITHUB_REF_NAME}"'.zip` attached below — SHA-256 checksum included.'
            echo "One web build for PC, Android and TVs — how to serve it: the [README](https://github.com/${GITHUB_REPOSITORY}#-install)."
          } >> RELEASE_NOTES.md

      - name: Construction
        run: npm run build

      - name: Contrat de poids
        run: npm run test:poids

      # Même réessai que la CI : un miroir apt qui dérive (ex. « Hash Sum
      # mismatch » sur dl.google.com) n'est pas un signal sur le code.
      - name: Installer Chromium pour l'e2e
        run: |
          for i in 1 2 3 4 5; do
            if npx -y playwright@1.62.1 install --with-deps chromium; then break; fi
            echo "Tentative $i échouée — nettoyage apt, nouvelle tentative dans 30 s" >&2
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get update
            sleep 30
          done

      - name: Localiser Chromium
        run: |
          CHEMIN=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)
          if [ -z "$CHEMIN" ]; then echo "Chromium introuvable après installation" >&2; exit 1; fi
          echo "SPACEHUB_CHROMIUM=$CHEMIN" >> "$GITHUB_ENV"

      - name: Tests de bout en bout
        run: npm run test:e2e

      # Une seule archive, un seul point d'entrée : dist/ est un site statique
      # (PWA) que l'on sert derrière nginx, Caddy ou Jellyfin — cf.
      # docs/DEPLOIEMENT.md. Il n'existe pas de build distinct par plateforme :
      # PC, Android et téléviseurs ouvrent la même application.
      - name: Assembler l'archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd dist
          zip -r "../spacehub-${VERSION}.zip" .
          cd ..
          sha256sum "spacehub-${VERSION}.zip" > "spacehub-${VERSION}.zip.sha256"

      - name: Publier la release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            spacehub-*.zip
            spacehub-*.zip.sha256
          body_path: RELEASE_NOTES.md
          draft: false
